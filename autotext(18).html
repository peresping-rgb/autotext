<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autotext</title>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a1a;
  --cream: #f2f0ea;
  --warm-gray: #e8e5df;
  --mid-gray: #a09a90;
  --accent: #c8502a;
  --ai-teal: #2a7c6f;
  --ai-teal-soft: #e4f0ee;
  --panel: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Syne', sans-serif;
  background: var(--cream);
  color: var(--ink);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOPBAR ── */
.topbar {
  background: var(--panel);
  border-bottom: 1.5px solid var(--warm-gray);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  flex-shrink: 0;
  z-index: 10;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
}
.logo em { font-style: italic; color: var(--accent); }
.logo-dot {
  width: 6px; height: 6px;
  background: var(--ai-teal);
  border-radius: 50%;
  margin-left: 4px;
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(0.6); }
}
.topbar-right { display: flex; align-items: center; gap: 10px; }

.lang-select {
  border: 1.5px solid var(--warm-gray); border-radius: 6px;
  padding: 4px 8px; font-family: 'Syne', sans-serif; font-size: 11px;
  font-weight: 600; color: var(--ink); background: white;
  cursor: pointer; height: 28px; outline: none; max-width: 160px;
}
.lang-select:focus { border-color: var(--ai-teal); }
.btn-key {
  background: none; border: 1.5px solid var(--warm-gray);
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
  font-size: 14px; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.btn-key:hover { border-color: var(--accent); }
.btn-key.has-key { border-color: var(--ai-teal); background: var(--ai-teal-soft); }
.save-indicator {
  font-size: 11px;
  color: var(--mid-gray);
  font-family: 'DM Mono', monospace;
  transition: color 0.3s;
}
.save-indicator.saved { color: var(--ai-teal); }

.btn-export {
  background: var(--accent); color: white; border: none;
  padding: 7px 16px;
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px;
  border-radius: 6px; cursor: pointer; transition: all 0.2s;
}
.btn-export:hover { background: #a83e1e; transform: translateY(-1px); }

/* ── TITLEBAR ── */
.titlebar {
  background: var(--cream);
  border-bottom: 1.5px solid var(--warm-gray);
  padding: 0 24px;
  display: flex; align-items: center;
  height: 40px; flex-shrink: 0;
  gap: 8px;
}
.doc-title-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--mid-gray);
  white-space: nowrap; font-family: 'Syne', sans-serif;
}
.doc-title-input {
  background: transparent; border: none; outline: none;
  font-family: 'DM Serif Display', serif; font-size: 16px;
  color: var(--ink); flex: 1; padding: 0 6px;
  border-bottom: 1.5px solid transparent; transition: border-color 0.2s;
}
.doc-title-input:focus { border-bottom-color: var(--accent); }
.doc-title-input::placeholder { color: var(--mid-gray); font-style: italic; }

/* ── AI LOADING BAR ── */
.ai-loading-bar {
  background: var(--ai-teal-soft);
  border-bottom: 1.5px solid var(--ai-teal);
  padding: 7px 20px;
  flex-shrink: 0;
  display: none;
}
.ai-loading-inner {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 600; color: var(--ai-teal);
  font-family: 'Syne', sans-serif;
}
.ai-loading-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ai-teal);
  animation: blink 0.8s ease-in-out infinite; flex-shrink: 0;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
#aiLoadingPct { font-family: 'DM Mono', monospace; font-size: 11px; margin-left: auto; }

/* ── TOOLBAR ── */
.toolbar-wrap {
  background: var(--panel);
  border-bottom: 1.5px solid var(--warm-gray);
  padding: 0 20px;
  display: flex; align-items: center; gap: 4px;
  height: 44px; flex-shrink: 0;
}
/* ── AI MENU ── */
.ai-menu-wrap { position: relative; flex-shrink: 0; }
.btn-ai {
  background: linear-gradient(135deg, var(--ai-teal), #1a5c52);
  color: white; border: none;
  height: 22px; padding: 0 10px; font-size: 11px; font-weight: 700;
  font-family: 'Syne', sans-serif; letter-spacing: 0.3px;
  border-radius: 5px; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 4px; flex-shrink: 0;
  white-space: nowrap;
}
.btn-ai:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(42,124,111,0.3); }
.btn-ai.no-key { background: var(--warm-gray); color: var(--mid-gray); cursor: default; }
.btn-ai.no-key:hover { transform: none; box-shadow: none; }
.ai-menu {
  display: none; position: absolute; top: 28px; left: 0;
  background: white; border: 1.5px solid var(--warm-gray);
  border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  z-index: 200; min-width: 200px; overflow: hidden;
}
.ai-menu.open { display: block; }
.ai-menu-item {
  display: block; width: 100%; text-align: left;
  background: none; border: none; cursor: pointer;
  padding: 10px 14px; font-size: 13px; font-weight: 600;
  font-family: 'Syne', sans-serif; color: var(--ink);
  transition: background 0.15s; border-bottom: 1px solid var(--warm-gray);
}
.ai-menu-item:last-child { border-bottom: none; }
.ai-menu-item:hover { background: var(--cream); }

/* ── AI PANEL ── */
.ai-panel {
  background: var(--ai-teal-soft);
  border-bottom: 1.5px solid var(--ai-teal);
  flex-shrink: 0; max-height: 240px;
  display: flex; flex-direction: column;
}
.ai-panel-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 16px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--ai-teal); font-family: 'Syne', sans-serif;
  border-bottom: 1px solid rgba(42,124,111,0.2);
}
.ai-panel-header button {
  background: none; border: none; cursor: pointer;
  color: var(--ai-teal); font-size: 13px; padding: 0;
}
.ai-panel-body {
  padding: 12px 16px; font-size: 13px; line-height: 1.65;
  color: var(--ink); overflow-y: auto; flex: 1;
  font-family: 'Syne', sans-serif; white-space: pre-wrap;
}
.ai-panel-footer { padding: 8px 16px; border-top: 1px solid rgba(42,124,111,0.2); }
.ai-panel-btn-apply {
  background: var(--ai-teal); color: white; border: none;
  padding: 6px 14px; border-radius: 5px; font-size: 12px;
  font-weight: 700; font-family: 'Syne', sans-serif; cursor: pointer;
  transition: background 0.2s;
}
.ai-panel-btn-apply:hover { background: #1a5c52; }

.divider { width: 1px; height: 22px; background: var(--warm-gray); margin: 0 6px; flex-shrink: 0; }

.btn-tool {
  background: none; border: none; cursor: pointer;
  width: 22px; height: 22px; border-radius: 4px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; flex-shrink: 0;
}
.btn-tool svg { width: 14px; height: 14px; fill: var(--mid-gray); transition: fill 0.15s; }
.btn-tool:hover { background: var(--cream); }
.btn-tool:hover svg { fill: var(--ink); }
.btn-tool.active svg { fill: var(--accent); }

/* Quill toolbar overrides */
#toolbar { border: none !important; padding: 0 !important; display: flex; align-items: center; gap: 2px; background: transparent; }
.ql-toolbar.ql-snow { border: none !important; padding: 0 !important; display: flex; align-items: center; gap: 2px; flex: 1; }
.ql-toolbar.ql-snow .ql-formats { display: flex; align-items: center; margin-right: 0; }
.ql-toolbar.ql-snow button {
  width: 22px; height: 22px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; padding: 0;
}
.ql-toolbar.ql-snow button svg { width: 13px; height: 13px; }
.ql-toolbar.ql-snow button:hover,
.ql-toolbar.ql-snow button.ql-active { background: var(--cream) !important; }
.ql-toolbar.ql-snow button svg .ql-stroke { stroke: var(--mid-gray); }
.ql-toolbar.ql-snow button:hover svg .ql-stroke,
.ql-toolbar.ql-snow button.ql-active svg .ql-stroke { stroke: var(--accent); }
.ql-toolbar.ql-snow button svg .ql-fill { fill: var(--mid-gray); }
.ql-toolbar.ql-snow button:hover svg .ql-fill,
.ql-toolbar.ql-snow button.ql-active svg .ql-fill { fill: var(--accent); }
.ql-toolbar.ql-snow select {
  border: 1.5px solid var(--warm-gray); border-radius: 5px;
  padding: 3px 6px; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 600;
  color: var(--ink); background: white; cursor: pointer; height: 28px; outline: none;
}
.ql-toolbar.ql-snow select:focus { border-color: var(--ai-teal); }

.btn-clean {
  background: none; border: none; cursor: pointer;
  width: 22px; height: 22px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; padding: 0; flex-shrink: 0;
}
.btn-clean svg { width: 14px; height: 14px; fill: var(--mid-gray); transition: fill 0.15s; }
.btn-clean:hover { background: #fde8e4; }
.btn-clean:hover svg { fill: var(--accent); }

/* ── WORKSPACE ── */
.workspace {
  flex: 1; overflow-y: auto;
  padding: 32px 20px;
  display: flex; justify-content: center;
}
.ql-container.ql-snow { border: none !important; background: transparent; width: 100%; max-width: 720px; }
.ql-editor {
  background: white; border-radius: 2px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
  min-height: 600px; padding: 60px 72px !important;
  font-family: 'DM Serif Display', serif; font-size: 16px; line-height: 1.75;
  color: var(--ink); outline: none;
}
.ql-editor h1 { font-family: 'DM Serif Display', serif; font-size: 2.2em; font-weight: 400; line-height: 1.2; margin-bottom: 0.5em; }
.ql-editor h2 {
  font-family: 'Syne', sans-serif; font-size: 1.1em; font-weight: 700;
  letter-spacing: 0.5px; text-transform: uppercase; color: var(--mid-gray);
  margin-bottom: 0.4em; border-bottom: 1.5px solid var(--warm-gray); padding-bottom: 6px;
}
.ql-editor p { margin-bottom: 0.8em; }

/* ── TOAST ── */
.ai-toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: white;
  padding: 10px 20px; border-radius: 100px;
  font-size: 13px; font-weight: 600; font-family: 'Syne', sans-serif;
  opacity: 0; pointer-events: none; transition: all 0.3s ease;
  display: flex; align-items: center; gap: 8px;
  z-index: 1000; white-space: nowrap;
}
.ai-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ai-teal); animation: blink 1s linear infinite; }

/* ── VERSIONSHISTORIK-PANEL ── */
.history-panel {
  position: fixed; top: 0; right: -300px; width: 280px;
  height: 100vh; background: var(--panel);
  border-left: 1.5px solid var(--warm-gray);
  box-shadow: -4px 0 20px rgba(0,0,0,0.06);
  z-index: 100; transition: right 0.3s ease;
  display: flex; flex-direction: column;
}
.history-panel.open { right: 0; }
.history-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 12px;
  border-bottom: 1.5px solid var(--warm-gray);
  font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
  text-transform: uppercase; color: var(--mid-gray); font-family: 'Syne', sans-serif;
}
.history-close { background: none; border: none; cursor: pointer; font-size: 14px; color: var(--mid-gray); padding: 0; }
.history-close:hover { color: var(--accent); }
.history-list { flex: 1; overflow-y: auto; padding: 8px; }
.history-empty { padding: 24px 12px; text-align: center; font-size: 12px; color: var(--mid-gray); line-height: 1.7; font-family: 'Syne', sans-serif; }
.history-day { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--mid-gray); padding: 10px 12px 4px; font-family: 'Syne', sans-serif; }
.history-item { padding: 10px 12px; border-radius: 6px; border: 1.5px solid transparent; margin-bottom: 4px; transition: all 0.15s; }
.history-item:hover { background: var(--cream); border-color: var(--warm-gray); }
.history-item-time { font-size: 12px; font-weight: 700; color: var(--ink); font-family: 'Syne', sans-serif; }
.history-item-relative { font-size: 10px; color: var(--mid-gray); margin-top: 2px; font-family: 'DM Mono', monospace; }
.history-item-preview { font-size: 11px; color: var(--mid-gray); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'DM Mono', monospace; }
.history-item-chars { font-size: 10px; color: var(--mid-gray); margin-top: 2px; font-family: 'DM Mono', monospace; }
.history-restore-btn {
  display: none; background: var(--accent); color: white; border: none;
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
  cursor: pointer; margin-top: 6px; font-family: 'Syne', sans-serif;
}
.history-item:hover .history-restore-btn { display: inline-block; }

.workspace::-webkit-scrollbar { width: 6px; }
.workspace::-webkit-scrollbar-track { background: transparent; }
.workspace::-webkit-scrollbar-thumb { background: var(--warm-gray); border-radius: 3px; }

/* Quill font-klasser — måste bindas till riktiga CSS-typsnitt */
.ql-font-georgia { font-family: Georgia, 'Times New Roman', serif !important; }
.ql-font-courier { font-family: 'Courier New', Courier, monospace !important; }

/* ── MOBILANPASSNING ── */
@media (max-width: 600px) {

  /* Topbar — kompakt */
  .topbar { padding: 0 12px; height: 48px; }
  .logo { font-size: 18px; }
  .logo-dot { width: 5px; height: 5px; }
  .lang-select { max-width: 110px; font-size: 10px; padding: 3px 4px; }
  .btn-export { padding: 5px 10px; font-size: 11px; }
  .save-indicator { display: none; } /* ta bort på mobil — sparar plats */

  /* Titlebar */
  .titlebar { padding: 0 12px; height: 36px; }
  .doc-title-label { display: none; }
  .doc-title-input { font-size: 14px; }

  /* Toolbar — scrollbar horisontellt */
  .toolbar-wrap {
    padding: 0 8px;
    height: auto; min-height: 40px;
    overflow-x: auto; overflow-y: hidden;
    flex-wrap: nowrap; gap: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .toolbar-wrap::-webkit-scrollbar { display: none; }

  /* AI-meny öppnas uppåt på mobil */
  .ai-menu { top: auto; bottom: 28px; }

  /* Quill dropdowns — mindre på mobil */
  .ql-toolbar.ql-snow select { font-size: 11px; padding: 2px 4px; height: 26px; }

  /* Editor — mindre padding */
  .ql-editor {
    padding: 24px 20px !important;
    font-size: 15px;
    min-height: 400px;
  }

  /* Workspace — less padding */
  .workspace { padding: 12px 8px; }

  /* AI-panel — full bredd */
  .ai-panel-body { font-size: 12px; padding: 10px 12px; }

  /* Versionshistorik — full bredd på mobil */
  .history-panel { width: 100%; right: -100%; }
  .history-panel.open { right: 0; }

  /* Touch-vänliga knappar — större klickyta */
  .btn-tool { width: 28px; height: 28px; }
  .btn-tool svg { width: 16px; height: 16px; }
  .btn-ai { height: 26px; padding: 0 8px; font-size: 11px; }
  .btn-clean { width: 28px; height: 28px; }
  .btn-clean svg { width: 16px; height: 16px; }

  /* Restore-knapp alltid synlig på mobil (ingen hover) */
  .history-restore-btn { display: inline-block; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">Auto<em>text</em><span class="logo-dot"></span></div>
  <div class="topbar-right">
    <select class="lang-select" id="langSelect" title="Välj ditt modersmål för AI-feedback" onchange="saveLang()">
      <option value="sv">🌐 Svenska</option>
      <option value="en">English Engelska</option>
      <option value="ar">عربي Arabiska</option>
      <option value="so">Af Soomaali Somaliska</option>
      <option value="fa">دری Dari/Persiska</option>
      <option value="ti">ትግርኛ Tigrinska</option>
      <option value="ku">Kurdî Kurdiska</option>
      <option value="pl">Polski Polska</option>
      <option value="es">Español Spanska</option>
      <option value="tr">Türkçe Turkiska</option>
      <option value="vi">Tiếng Việt Vietnamesiska</option>
      <option value="ro">Romani Romani</option>
    </select>
    <button class="btn-key" onclick="setGroqKey()" id="btnKey" title="Ange Groq API-nyckel">🔑</button>
    <span class="save-indicator" id="saveIndicator">Osparad</span>
    <button class="btn-export" onclick="exportToWord()">⬇ Word-fil</button>
  </div>
</div>

<!-- TITLEBAR -->
<div class="titlebar">
  <span class="doc-title-label">Dokument:</span>
  <input class="doc-title-input" id="docTitle" type="text" placeholder="Namnlöst dokument" maxlength="100" oninput="saveTitle()">
</div>

<!-- TOOLBAR -->
<div class="toolbar-wrap">
  <div class="ai-menu-wrap" id="aiMenuWrap">
    <button class="btn-ai" id="btnAI" onclick="toggleAIMenu()" title="AI-hjälp">✨ AI</button>
    <div class="ai-menu" id="aiMenu">
      <button class="ai-menu-item" onclick="runAI('improve')">✨ Förbättra min text</button>
      <button class="ai-menu-item" onclick="runAI('write')">📝 Hjälp mig skriva</button>
      <button class="ai-menu-item" onclick="runAI('learn')">🎓 Lär mig skriva</button>
    </div>
  </div>
  <div class="divider"></div>
  <button class="btn-tool" onclick="quill.history.undo()" title="Ångra (Ctrl+Z)">
    <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
  </button>
  <button class="btn-tool" onclick="quill.history.redo()" title="Gör om (Ctrl+Y)">
    <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 15.7c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 15h9V6l-3.6 4.6z"/></svg>
  </button>
  <div class="divider"></div>
  <button class="btn-tool" id="historyBtn" onclick="toggleHistory()" title="Versionshistorik">
    <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
  </button>
  <div class="divider"></div>
  <div id="toolbar">
    <span class="ql-formats">
      <select class="ql-header">
        <option selected>Vanlig text</option>
        <option value="1">Stor rubrik</option>
        <option value="2">Mellanrubrik</option>
      </select>
    </span>
    <span class="ql-formats">
      <select class="ql-font">
        <option selected>Modern</option>
        <option value="georgia">Bok</option>
        <option value="courier">Skrivmaskin</option>
      </select>
    </span>
    <div class="divider"></div>
    <span class="ql-formats">
      <button class="ql-bold"></button>
      <button class="ql-italic"></button>
      <button class="ql-underline"></button>
    </span>
    <div class="divider"></div>
    <span class="ql-formats">
      <button class="ql-list" value="bullet"></button>
      <button class="ql-list" value="ordered"></button>
    </span>
    <div class="divider"></div>
    <button class="btn-clean" onclick="cleanFormatting()" title="Rensa konstig formatering">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>
</div>

<!-- WORKSPACE -->
<!-- AI PANEL (feedback/lär) -->
<div class="ai-panel" id="aiPanel" style="display:none">
  <div class="ai-panel-header">
    <span id="aiPanelTitle">AI-svar</span>
    <button onclick="closeAIPanel()">✕</button>
  </div>
  <div class="ai-panel-body" id="aiPanelBody"></div>
  <div class="ai-panel-footer" id="aiPanelFooter" style="display:none">
    <button class="ai-panel-btn-apply" onclick="applyAISuggestion()">↩ Ersätt min text med detta</button>
  </div>
</div>

<div class="workspace">
  <div id="editor">
    <h1>Välkommen till Autotext</h1>
    <p>Skriv ditt dokument här i lugn och ro. Allt sparas automatiskt.</p>
    <p>Markera text och tryck <strong>✨</strong> för att AI ska förbättra språket.</p>
  </div>
</div>

<!-- TOAST -->
<div class="ai-toast" id="aiToast">
  <span class="toast-dot"></span>
  <span id="toastMsg"></span>
</div>

<!-- VERSIONSHISTORIK-PANEL -->
<div class="history-panel" id="historyPanel">
  <div class="history-header">
    <span>Versionshistorik</span>
    <button class="history-close" onclick="toggleHistory()">✕</button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<script>
// ── QUILL ──
var Font = Quill.import('formats/font');
Font.whitelist = ['georgia', 'courier'];
Quill.register(Font, true);

var quill = new Quill('#editor', {
  modules: {
    toolbar: '#toolbar',
    history: { delay: 500, maxStack: 100, userOnly: true }
  },
  theme: 'snow'
});

// ── LOCALSTORAGE ──
const STORAGE_KEY = 'autotext_doc';
const TITLE_KEY   = 'autotext_title';

const saved = localStorage.getItem(STORAGE_KEY);
if (saved) { try { quill.setContents(JSON.parse(saved)); } catch(e) {} }

const savedTitle = localStorage.getItem(TITLE_KEY);
if (savedTitle) {
  document.getElementById('docTitle').value = savedTitle;
  document.title = savedTitle + ' – Autotext';
}

function saveTitle() {
  const val = document.getElementById('docTitle').value;
  localStorage.setItem(TITLE_KEY, val);
  document.title = (val || 'Namnlöst dokument') + ' – Autotext';
}

let saveTimer;
const saveIndicator = document.getElementById('saveIndicator');
quill.on('text-change', function(delta, old, source) {
  if (source !== 'user') return;
  saveIndicator.textContent = 'Sparar...';
  saveIndicator.className = 'save-indicator';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(quill.getContents()));
    saveIndicator.textContent = '✓ Sparat';
    saveIndicator.className = 'save-indicator saved';
  }, 600);
});

// ── TOAST ──
let toastTimer;
function showToast(msg, duration) {
  const toast = document.getElementById('aiToast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  if (duration) toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}
function hideToast() { document.getElementById('aiToast').classList.remove('show'); }

// ── SPRÅK ──
const LANG_KEY = 'autotext_lang';
const LANG_NAMES = {
  sv: 'svenska', en: 'engelska', ar: 'arabiska', so: 'somaliska', fa: 'dari/persiska',
  ti: 'tigrinska', ku: 'kurdiska', pl: 'polska', es: 'spanska',
  tr: 'turkiska', vi: 'vietnamesiska', ro: 'romani'
};
const LANG_NATIVE = {
  sv: 'svenska', en: 'English', ar: 'العربية', so: 'Af Soomaali', fa: 'دری',
  ti: 'ትግርኛ', ku: 'Kurdî', pl: 'polski', es: 'español',
  tr: 'Türkçe', vi: 'Tiếng Việt', ro: 'Romani'
};

function getLang() { return localStorage.getItem(LANG_KEY) || 'sv'; }
function saveLang() {
  const val = document.getElementById('langSelect').value;
  localStorage.setItem(LANG_KEY, val);
  showToast(`✓ AI-feedback på ${LANG_NAMES[val]}`, 2000);
}

// Sätt sparad språkväljar-inställning
const savedLang = getLang();
document.getElementById('langSelect').value = savedLang;
const GROQ_KEY_STORAGE = 'autotext_groq_key';
function getGroqKey() { return localStorage.getItem(GROQ_KEY_STORAGE); }

let pendingWriteSuggestion = '';

function updateAIButton() {
  const btn = document.getElementById('btnAI');
  const keyBtn = document.getElementById('btnKey');
  if (getGroqKey()) {
    btn.classList.remove('no-key');
    keyBtn.classList.add('has-key');
  } else {
    btn.classList.add('no-key');
    keyBtn.classList.remove('has-key');
  }
}

function setGroqKey() {
  const existing = getGroqKey();
  const key = prompt(existing
    ? 'Ersätt din Groq-nyckel (lämna tomt för att ta bort):'
    : 'Klistra in din Groq API-nyckel:\n\nHämta gratis på: console.groq.com\n(Inget kreditkort krävs!)', existing || '');
  if (key === null) return;
  if (key.trim() === '') {
    localStorage.removeItem(GROQ_KEY_STORAGE);
    showToast('🔑 AI-nyckel borttagen', 2000);
  } else {
    localStorage.setItem(GROQ_KEY_STORAGE, key.trim());
    showToast('✓ AI aktiverad!', 2000);
  }
  updateAIButton();
}

updateAIButton();

function toggleAIMenu() {
  if (!getGroqKey()) {
    showToast('💡 Klicka 🔑 för att aktivera AI — gratis på console.groq.com', 4000);
    return;
  }
  document.getElementById('aiMenu').classList.toggle('open');
}

// Stäng menyn om man klickar utanför
document.addEventListener('click', e => {
  if (!document.getElementById('aiMenuWrap').contains(e.target)) {
    document.getElementById('aiMenu').classList.remove('open');
  }
});

function showAIPanel(title, content, showApply) {
  document.getElementById('aiPanelTitle').textContent = title;
  document.getElementById('aiPanelBody').textContent = content;
  document.getElementById('aiPanelFooter').style.display = showApply ? 'block' : 'none';
  document.getElementById('aiPanel').style.display = 'flex';
}

function closeAIPanel() {
  document.getElementById('aiPanel').style.display = 'none';
  pendingWriteSuggestion = '';
}

function applyAISuggestion() {
  if (!pendingWriteSuggestion) return;
  const sel = quill.getSelection();
  const index  = sel && sel.length > 0 ? sel.index : 0;
  const length = sel && sel.length > 0 ? sel.length : quill.getLength() - 1;
  quill.deleteText(index, length, 'user');
  quill.insertText(index, pendingWriteSuggestion, 'user');
  closeAIPanel();
  showToast('✓ Text infogad', 2000);
}

async function callGroq(systemPrompt, userContent) {
  const key = getGroqKey();
  const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      temperature: 0.3,
      max_tokens: 2000,
      messages: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userContent }
      ]
    })
  });
  const data = await response.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices?.[0]?.message?.content?.trim();
}

async function runAI(mode) {
  document.getElementById('aiMenu').classList.remove('open');
  const sel = quill.getSelection();
  const hasSelection = sel && sel.length > 0;
  const index  = hasSelection ? sel.index : 0;
  const length = hasSelection ? sel.length : quill.getLength() - 1;
  const text   = quill.getText(index, length).trim();

  if (mode === 'improve') {
    if (text.length < 3) { showToast('⚠ Skriv lite text först', 2000); return; }
    showToast('Förbättrar texten...');
    try {
      const result = await callGroq(
        'Du är en skicklig svensk språkredaktör. Rätta stavfel, grammatik och förbättra meningsbyggnad och stil så texten flyter naturligt på svenska. Bevara textens ursprungliga ton och innebörd. Svara ENBART med den förbättrade texten, inga kommentarer.',
        text
      );
      hideToast();
      if (result && result !== text) {
        quill.deleteText(index, length, 'user');
        quill.insertText(index, result, 'user');
        showToast('✓ Text förbättrad', 2000);
      } else {
        showToast('✓ Texten ser redan bra ut', 2000);
      }
    } catch(e) { hideToast(); showToast('⚠ ' + e.message, 3000); }

  } else if (mode === 'write') {
    const lang = getLang();
    const langName = LANG_NAMES[lang];
    const what = prompt(lang === 'sv'
      ? 'Vad vill du skriva? Beskriv kort:'
      : `Vad vill du skriva? / What do you want to write? (du kan skriva på ${langName} eller svenska):`);
    if (!what) return;
    showToast('Skriver utkast...');
    try {
      const result = await callGroq(
        `Du hjälper andraspråkselever att skriva brev och texter på korrekt, tydlig svenska. Användaren beskriver vad de vill säga, eventuellt på ${langName}. Skriv ett välformulerat utkast på svenska med lämplig ton. Svara ENBART med den svenska texten, inga förklaringar.`,
        what
      );
      hideToast();
      if (result) {
        pendingWriteSuggestion = result;
        showAIPanel('📝 Förslag — granska och ersätt om du vill', result, true);
      }
    } catch(e) { hideToast(); showToast('⚠ ' + e.message, 3000); }

  } else if (mode === 'learn') {
    if (text.length < 10) { showToast('⚠ Skriv lite text först', 2000); return; }
    const lang = getLang();
    const langName = LANG_NAMES[lang];
    const nativeName = LANG_NATIVE[lang];
    showToast('Analyserar din text...');
    try {
      const result = await callGroq(
        `Du är en tålmodig och uppmuntrande lärare i svenska som andraspråk. Ge feedback på ${langName === 'svenska' ? 'svenska' : `${langName} (${nativeName})`}: 1) Vad är bra? 2) Vad kan bli bättre? (max 3 konkreta saker) 3) Ett tips för nästa gång. Var kortfattad, vänlig och pedagogisk. Skriv inte om texten.`,
        text
      );
      hideToast();
      if (result) showAIPanel('🎓 Lärarens feedback', result, false);
    } catch(e) { hideToast(); showToast('⚠ ' + e.message, 3000); }
  }
}

// Bakåtkompatibilitet
function runAIManual() { runAI('improve'); }

// ── RENSA FORMATERING ──
function cleanFormatting() {
  const sel = quill.getSelection();
  if (sel && sel.length > 0) {
    quill.removeFormat(sel.index, sel.length);
    showToast('🧹 Formatering rensad', 1800);
  } else {
    quill.removeFormat(0, quill.getLength());
    showToast('🧹 All formatering rensad', 1800);
  }
}

// ── WORD-EXPORT ──
function exportToWord() {
  const html    = quill.getSemanticHTML();
  const title   = document.getElementById('docTitle').value.trim() || 'Autotext_Dokument';
  const header  = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>body{font-family:Georgia,serif;font-size:12pt;line-height:1.6;margin:2cm;}h1{font-size:24pt;}h2{font-size:14pt;text-transform:uppercase;letter-spacing:1px;}</style></head><body>";
  const footer  = "</body></html>";
  const blob    = new Blob(['\ufeff' + header + html + footer], { type: 'application/msword' });
  const url     = URL.createObjectURL(blob);
  const a       = document.createElement('a');
  a.href = url; a.download = title + '.doc'; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ Word-fil nedladdad', 2000);
}

// ── VERSIONSHISTORIK ──
const HISTORY_KEY   = 'autotext_history';
const INTERVALS_MS  = [60000,120000,240000,480000,960000,1800000,3600000,7200000,14400000,28800000,86400000,172800000,345600000,604800000];
let versions = [];
try { versions = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { versions = []; }
renderHistory();

function shouldSaveVersion() {
  if (quill.getText().trim().length < 5) return false;
  if (!versions.length) return true;
  const age = Date.now() - versions[0].ts;
  const idx = Math.min(versions.length, INTERVALS_MS.length - 1);
  return age >= INTERVALS_MS[idx];
}

function saveVersion(force) {
  if (!force && !shouldSaveVersion()) return;
  const text = quill.getText().trim();
  if (text.length < 5) return;
  const now = new Date();
  const ts  = now.getTime();
  versions.unshift({
    ts,
    contents: quill.getContents(),
    preview:  text.slice(0, 60),
    chars:    text.length
  });
  versions = versions.filter(v => v.ts >= ts - 604800000); // max 1 vecka
  localStorage.setItem(HISTORY_KEY, JSON.stringify(versions));
  renderHistory();
}

function formatRelative(ts) {
  const d = Date.now() - ts;
  if (d < 90000)       return 'För 1 minut sedan';
  if (d < 3600000)     return `För ${Math.round(d/60000)} min sedan`;
  if (d < 7200000)     return 'För 1 timme sedan';
  if (d < 86400000)    return `För ${Math.round(d/3600000)} tim sedan`;
  if (d < 172800000)   return 'Igår';
  if (d < 604800000)   return `För ${Math.round(d/86400000)} dagar sedan`;
  return 'För 1 vecka sedan';
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!versions.length) {
    list.innerHTML = '<div class="history-empty">Inga versioner ännu.<br><br>Sparas automatiskt: 1 min → 2 min → 4 min → … → 1 vecka.</div>';
    return;
  }
  let lastDay = '';
  list.innerHTML = versions.map((v, i) => {
    const d   = new Date(v.ts);
    const day = d.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
    const hdr = day !== lastDay ? `<div class="history-day">${day}</div>` : '';
    lastDay = day;
    const time = d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
    return `${hdr}<div class="history-item">
      <div class="history-item-time">${time}</div>
      <div class="history-item-relative">${formatRelative(v.ts)}</div>
      <div class="history-item-preview">${v.preview}${v.chars > 60 ? '…' : ''}</div>
      <div class="history-item-chars">${v.chars.toLocaleString('sv-SE')} tecken</div>
      <button class="history-restore-btn" onclick="restoreVersion(${i})">↩ Återställ</button>
    </div>`;
  }).join('');
}

function restoreVersion(i) {
  if (!confirm('Återställa till denna version? Nuvarande text sparas som ny version först.')) return;
  saveVersion(true);
  quill.setContents(versions[i].contents);
  showToast('↩ Version återställd', 2000);
  toggleHistory();
}

function toggleHistory() {
  document.getElementById('historyPanel').classList.toggle('open');
  document.getElementById('historyBtn').classList.toggle('active');
}

setInterval(() => saveVersion(false), 30000);

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault(); window.print(); }
});
</script>
</body>
</html>
